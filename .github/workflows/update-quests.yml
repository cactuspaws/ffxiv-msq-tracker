name: Update MSQ quest database
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_quests.py'
      - '.github/workflows/update-quests.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_quests.py
      - name: Commit validated quest list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quests.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified MSQ quest list"
            git push
          fi
